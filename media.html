<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Home Media Archive</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f1e8;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 35px 7%;
    color: white;
}

header h1 {
    margin: 0 0 8px;
}

main {
    max-width: 1200px;
    margin: auto;
    padding: 40px 7%;
}

.search {
    width: 100%;
    box-sizing: border-box;
    padding: 15px;
    font-size: 17px;
    border: 1px solid #bbb;
    border-radius: 8px;
    margin-bottom: 25px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
}

.item {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 22px;
}

.item h2 {
    margin-top: 0;
}

.meta {
    color: #666;
    line-height: 1.7;
}

.status {
    margin-bottom: 20px;
    color: #666;
}

</style>

</head>

<body>

<header>

<h1>Home Media Archive</h1>

<p>Disney Channel Home EXP Archive</p>

</header>


<main>

<input
    id="search"
    class="search"
    type="search"
    placeholder="Search the archive..."
>

<div
    id="status"
    class="status"
>
Loading archive...
</div>

<div
    id="results"
    class="grid"
></div>

</main>


<script>

let records = [];


/* CSV PARSER */

function parseCSV(text) {

    const rows = [];

    let row = [];

    let cell = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char = text[i];

        const next = text[i + 1];


        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            cell += '"';

            i++;

        }

        else if (char === '"') {

            insideQuotes =
                !insideQuotes;

        }

        else if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(cell);

            cell = "";

        }

        else if (
            (char === "\n" ||
             char === "\r") &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;

            }

            row.push(cell);

            rows.push(row);

            row = [];

            cell = "";

        }

        else {

            cell += char;

        }

    }


    if (
        cell !== "" ||
        row.length > 0
    ) {

        row.push(cell);

        rows.push(row);

    }


    return rows;

}


/* LOAD DATABASE */

async function loadArchive() {

    try {

        const response =
            await fetch(
                "data/Disney%20Channel%20Archive%20-%20Home%20Media.csv"
            );


        if (!response.ok) {

            throw new Error(
                "CSV error: " +
                response.status
            );

        }


        const text =
            await response.text();


        const rows =
            parseCSV(text);


        /*
            ROW 1 = BLANK
            ROW 2 = HEADERS
            ROW 3+ = RECORDS
        */


        const headers =
            rows[1].map(
                function(header) {

                    return header
                        .replace(/^\uFEFF/, "")
                        .trim()
                        .toUpperCase();

                }
            );


        records =
            rows
            .slice(2)
            .filter(
                function(row) {

                    return row.some(
                        function(cell) {

                            return cell.trim() !== "";

                        }
                    );

                }
            )
            .map(
                function(row) {

                    const record = {};


                    headers.forEach(
                        function(header, index) {

                            record[header] =
                                (
                                    row[index] ||
                                    ""
                                ).trim();

                        }
                    );


                    return record;

                }
            );


        document
            .getElementById("status")
            .textContent =
            records.length +
            " records in the archive.";


        displayRecords(records);

    }


    catch (error) {

        console.error(error);


        document
            .getElementById("status")
            .textContent =
            "Unable to load the archive data.";

    }

}


/* DISPLAY RECORDS */

function displayRecords(items) {

    const results =
        document.getElementById(
            "results"
        );


    results.innerHTML = "";


    if (
        items.length === 0
    ) {

        results.innerHTML =
            "<p>No records found.</p>";

        return;

    }


    items.forEach(
        function(item) {


            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "item";


            card.innerHTML = `

                <h2>
                    ${item["RELEASE"] || "Untitled Release"}
                </h2>

                <div class="meta">

                    <strong>Archive ID:</strong>
                    ${item["ID"] || "—"}

                    <br>

                    <strong>Country:</strong>
                    ${item["COUNTRY"] || "—"}

                    <br>

                    <strong>Franchise:</strong>
                    ${item["FRANCHISE"] || "—"}

                    <br>

                    <strong>Condition:</strong>
                    ${item["CONDITION"] || "—"}

                    <br>

                    <strong>Year:</strong>
                    ${item["YEAR"] || "—"}

                    <br>

                    <strong>Barcode:</strong>
                    ${item["BAR CODE"] || "—"}

                    <br>

                    <strong>Rarity:</strong>
                    ${item["RARITY"] || "—"}

                </div>

                <p>
                    ${item["ADD INFORMATION"] || ""}
                </p>

            `;


            results.appendChild(card);

        }
    );

}


/* SEARCH */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function() {

            const query =
                this.value
                .toLowerCase();


            const filtered =
                records.filter(
                    function(item) {

                        return Object
                            .values(item)
                            .join(" ")
                            .toLowerCase()
                            .includes(query);

                    }
                );


            displayRecords(
                filtered
            );

        }
    );


/* START */

loadArchive();

</script>

</body>
</html>
