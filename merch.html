
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disney Channel Merchandise Archive</title>

<style>
:root {
  --green: #78905f;
  --dark-green: #596e49;
  --light-green: #e8f0d9;
  --cream: #f5f3e9;
  --text: #283020;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #171a15;
  color: var(--text);
  font-family: Arial, sans-serif;
}

.page {
  width: 100%;
  max-width: 1700px;
  margin: auto;
  padding: 25px;
}

.archive-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  color: var(--light-green);
  margin-bottom: 20px;
}

.archive-header h1 {
  font-size: clamp(22px, 3vw, 36px);
  margin: 0;
}

button {
  font-family: inherit;
  cursor: pointer;
}

.language-button,
.home-button {
  background: var(--green);
  color: white;
  border: none;
  border-radius: 7px;
  padding: 11px 17px;
  font-size: 14px;
  font-weight: bold;
}

.language-button:hover,
.home-button:hover {
  background: var(--dark-green);
}

.search-container {
  max-width: 650px;
  margin: 0 auto 25px;
}

.search-container input,
.collection-search {
  width: 100%;
  padding: 13px 16px;
  border: 2px solid var(--green);
  border-radius: 8px;
  background: #fff;
  color: #222;
  font-size: 15px;
  outline: none;
}

.search-container input:focus,
.collection-search:focus {
  border-color: var(--light-green);
}

.cabinet-stage {
  position: relative;
  width: 100%;
  max-width: 1600px;
  margin: 0 auto;
  aspect-ratio: 1280 / 270;
  background-image: url("merchandise%20and%20archives.png");
  background-size: 100% 100%;
  background-repeat: no-repeat;
}

.shelf-hotspot {
  position: absolute;
  top: 5%;
  height: 88%;
  border: none;
  background: transparent;
  cursor: pointer;
  border-radius: 10px;
}

.shelf-hotspot:hover {
  background: rgba(232, 240, 217, 0.10);
  outline: 2px dashed rgba(232, 240, 217, 0.65);
}

.ads-hotspot {
  left: 3%;
  width: 44%;
}

.merch-hotspot {
  right: 3%;
  width: 44%;
}

.home-container {
  display: flex;
  justify-content: center;
  margin: 25px 0;
}

#archiveModal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0, 0, 0, 0.82);
  padding: 20px;
  overflow-y: auto;
}

.modal-panel {
  width: 100%;
  max-width: 1150px;
  min-height: 300px;
  margin: 35px auto;
  padding: 25px;
  border-radius: 12px;
  background: var(--cream);
  box-shadow: 0 10px 40px rgba(0,0,0,.4);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  border-bottom: 2px solid #d5ddc8;
  padding-bottom: 15px;
  margin-bottom: 20px;
}

.modal-header h2 {
  font-size: clamp(20px, 3vw, 30px);
  margin: 0;
  color: var(--dark-green);
}

.modal-actions {
  display: flex;
  gap: 8px;
}

.modal-button {
  border: none;
  border-radius: 6px;
  padding: 9px 14px;
  background: var(--green);
  color: white;
  font-weight: bold;
}

.modal-button:hover {
  background: var(--dark-green);
}

.archive-menu {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 15px;
  margin-top: 20px;
}

.archive-option {
  min-height: 100px;
  padding: 20px;
  border: 2px solid #d3ddc6;
  border-radius: 9px;
  background: white;
  color: var(--dark-green);
  font-size: 18px;
  font-weight: bold;
  text-align: left;
}

.archive-option:hover {
  background: var(--light-green);
  border-color: var(--green);
}

.section-description {
  color: #56604d;
  line-height: 1.6;
  margin: 5px 0 20px;
}

.collection-search {
  margin: 10px 0 20px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 20px;
}

.gallery-card {
  background: white;
  border: 1px solid #dce2d5;
  border-radius: 9px;
  overflow: hidden;
  padding: 12px;
}

.gallery-card img {
  display: block;
  width: 100%;
  height: 220px;
  object-fit: contain;
  background: #f7f7f2;
  border-radius: 5px;
  user-select: none;
  -webkit-user-drag: none;
}

.gallery-card h3 {
  font-size: 16px;
  line-height: 1.35;
  margin: 12px 0 7px;
  color: var(--dark-green);
}

.gallery-card p {
  font-size: 13px;
  line-height: 1.5;
  margin: 0;
  color: #42483d;
}

.empty-message {
  padding: 25px;
  text-align: center;
  color: #68705e;
  background: white;
  border-radius: 8px;
}

.external-link {
  display: block;
  margin-top: 20px;
  padding: 16px;
  border-radius: 8px;
  background: var(--light-green);
  color: var(--dark-green);
  text-decoration: none;
  font-weight: bold;
  line-height: 1.5;
}

.external-link:hover {
  background: #d9e6c9;
}

@media (max-width: 650px) {
  .page {
    padding: 12px;
  }

  .cabinet-stage {
    aspect-ratio: 1280 / 500;
  }

  .ads-hotspot {
    left: 1%;
    width: 48%;
  }

  .merch-hotspot {
    right: 1%;
    width: 48%;
  }

  .modal-panel {
    padding: 16px;
    margin: 10px auto;
  }

  .gallery {
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 12px;
  }

  .gallery-card img {
    height: 165px;
  }
}
</style>
</head>

<body>
<div class="page">

  <header class="archive-header">
    <h1 id="pageTitle">Disney Channel Merchandise Archive</h1>
    <button class="language-button" onclick="toggleLanguage()" id="languageButton">
      Español
    </button>
  </header>

  <div class="search-container">
    <input
      id="archiveSearch"
      type="search"
      placeholder="Search the merchandise archive..."
      oninput="globalSearch()"
    >
  </div>

  <main>
    <div class="cabinet-stage">
      <button
        class="shelf-hotspot ads-hotspot"
        aria-label="Advertising archive"
        onclick="openAdsMenu()">
      </button>

      <button
        class="shelf-hotspot merch-hotspot"
        aria-label="Merchandise collections"
        onclick="openMerchMenu()">
      </button>
    </div>
  </main>

  <div class="home-container">
    <button class="home-button" id="homeButton" onclick="goHome()">
      ← Back to Home
    </button>
  </div>
</div>

<div id="archiveModal">
  <div class="modal-panel">

    <div class="modal-header">
      <h2 id="modalTitle">Archive</h2>

      <div class="modal-actions">
        <button class="modal-button" id="backButton" onclick="goBack()" style="display:none">
          ← Back
        </button>
        <button class="modal-button" onclick="closeModal()" id="closeButton">
          ✕
        </button>
      </div>
    </div>

    <div id="modalContent"></div>

  </div>
</div>

<script>
/* =========================================================
   LANGUAGE AND TRANSLATIONS
========================================================= */

let english = true;

const translations = {

    movies: "Películas",
    searchCollection: "Buscar en esta colección...",
    noResults: "No se encontraron resultados.",
    noImages: "Todavía no hay artículos en esta colección.",
    back: "← Volver",
    close: "✕",
    adDescription: "Anuncios impresos y material promocional de la historia de Disney Channel.",
    merchDescription: "Explora productos físicos lanzados para las series y películas de Disney Channel.",
    lostDescription: "Explora la colección Lost Media en YouTube.",
    released: "Lanzamiento:",
    marketValue: "Precio histórico:",
    currentValue: "Valor actual estimado:",
    region: "Región:",
    details: "Información del producto"
  }
};

function T(key) {
  return english ? translations.en[key] : translations.es[key];
}

function toggleLanguage() {
  english = !english;

  document.documentElement.lang = english ? "en" : "es";
  document.getElementById("pageTitle").textContent = T("pageTitle");
  document.getElementById("languageButton").textContent = english ? "Español" : "English";
  document.getElementById("archiveSearch").placeholder = T("search");
  document.getElementById("homeButton").textContent = T("home");
  document.getElementById("backButton").textContent = T("back");
  document.getElementById("closeButton").textContent = T("close");

  renderCurrentView();
}

function goHome() {
  const url = english
    ? "https://disneyrocklover.itch.io/disneychannelhomeexparchive"
    : "https://disneyrocklover.itch.io/lacasaexpdisneychannelarchivo";

  window.location.href = url;
}

/* =========================================================

   Image files are located in merch/ads/
========================================================= */

const physicalAds = [

    },

    }
  },

    },
    description: {

      es: "Interior del inserto promocional del DVD de Jump In! Incluye promociones adicionales de CD de Disney Channel y un anuncio de Cory en la Casa."
    }
  },

  {
    image: "merch/ads/disney-channel-cd-cory-ad.jpeg",
    title: {
      en: "Disney Channel CD and Cory in the House Advertisement",
      es: "Anuncio de CD de Disney Channel y Cory en la Casa"
    },
    description: {
      en: "Promotional material for Disney Channel CDs and Cory in the House, found inside the Jump In! DVD advertisement.",
      es: "Material promocional de CD de Disney Channel y Cory en la Casa, encontrado en el interior del anuncio del DVD de Jump In!"
    }
  }
];

/* Direct YouTube playlist. This is intentionally NOT a modal. */
const lostMediaPlaylist = "https://www.youtube.com/playlist?list=PLWpcZxU5Jq5s";

/* =========================================================
   MERCHANDISE COLLECTIONS

   All images are displayed inside the archive.
   They are not clickable download links.
========================================================= */

const merchCollections = {

  series: {
    "Hannah Montana": [
      {
        image: "merch/series/Screenshot_20260714_181909_Chrome-Photoroom.png",
        title: {
          en: "Hannah Montana Forever Window Panel",
          es: "Panel de ventana Hannah Montana Forever"
        },
        description: {

        }
      },

      {

      {

      {

        }
      },

      {
        image: "merch/series/91Xz4VWX5jL._AC_SL1500_-Photoroom.png",
        title: {
          en: "Hannah Montana Stationery Set",
          es: "Set de artículos de escritorio Hannah Montana"
        },
        description: {

          es: "Set de artículos de escritorio de Hannah Montana lanzado en España en 2009. Incluye marcadores, un sacapuntas y cinta adhesiva."
        }
      },

      {

        },

        }
      },

      {

        },

          es: "Sandwichera de Hannah Montana con diseño de la tercera temporada, lanzada en 2009."
        }
      },

      {

        },

        }
      }
    ],

    "That's So Raven": [],

    "Kim Possible": [],

    "Wizards of Waverly Place": [],

    "The Proud Family": []
  },

  movies: {
    "Camp Rock": [],
    "High School Musical": [],
    "The Cheetah Girls": []
  }
};

/* =========================================================
   NAVIGATION STATE
========================================================= */

let currentView = "home";
let selectedSection = null;
let selectedShow = null;

const modal = document.getElementById("archiveModal");
const modalTitle = document.getElementById("modalTitle");
const modalContent = document.getElementById("modalContent");
const backButton = document.getElementById("backButton");

function openModal() {
  modal.style.display = "block";
  document.body.style.overflow = "hidden";
}

function closeModal() {
  modal.style.display = "none";
  document.body.style.overflow = "";
  currentView = "home";
  selectedSection = null;
  selectedShow = null;
}

function setView(view) {
  currentView = view;
  renderCurrentView();
}

function goBack() {
  if (currentView === "gallery") {
    if (selectedSection === "ads") {
      currentView = "adsMenu";
    } else {
      currentView = "merchMenu";
    }
  } else if (currentView === "adsMenu" || currentView === "merchMenu") {
    currentView = "home";
  } else {
    currentView = "home";
  }

  renderCurrentView();
}

/* =========================================================
   MAIN MENUS
========================================================= */

function openAdsMenu() {
  selectedSection = "ads";
  currentView = "adsMenu";
  openModal();
  renderCurrentView();
}

function openMerchMenu() {
  selectedSection = "merch";
  currentView = "merchMenu";
  openModal();
  renderCurrentView();
}

function renderAdsMenu() {
  modalTitle.textContent = T("ads");

  modalContent.innerHTML = `
    <p class="section-description">${T("adDescription")}</p>

    <div class="archive-menu">
      <button class="archive-option" onclick="openPhysicalAds()">
        📄 ${T("physicalAds")}
      </button>

      <a class="archive-option external-link"
         href="${lostMediaPlaylist}"
         target="_blank"
         rel="noopener noreferrer">
        📺 ${T("lostMedia")}
        <p style="font-size:13px;font-weight:normal;margin-top:10px">
          ${T("lostDescription")}
        </p>
      </a>
    </div>
  `;
}

function renderMerchMenu() {
  modalTitle.textContent = T("merch");

  modalContent.innerHTML = `
    <p class="section-description">${T("merchDescription")}</p>

    <div class="archive-menu">
      <button class="archive-option" onclick="openCategory('series')">
        📺 ${T("series")}
      </button>

      <button class="archive-option" onclick="openCategory('movies')">
        🎬 ${T("movies")}
      </button>
    </div>
  `;
}

function openCategory(category) {
  selectedSection = category;
  currentView = "category";
  renderCategory(category);
}

function renderCategory(category) {
  const collection = merchCollections[category];

  modalTitle.textContent = category === "series" ? T("series") : T("movies");

  let buttons = "";

  Object.keys(collection).forEach(show => {
    buttons += `
      <button class="archive-option" onclick="openCollection('${escapeHTML(show)}')">
        ${escapeHTML(show)}
      </button>
    `;
  });

  modalContent.innerHTML = `
    <div class="archive-menu">${buttons}</div>
  `;
}

/* =========================================================
   GALLERIES
========================================================= */

function openPhysicalAds() {
  selectedSection = "ads";
  selectedShow = null;
  currentView = "gallery";
  renderGallery(physicalAds);
}

function openCollection(show) {
  selectedShow = show;
  currentView = "gallery";

  const collection = merchCollections[selectedSection][show] || [];
  renderGallery(collection);
}

function renderGallery(items) {
  modalTitle.textContent = selectedSection === "ads"
    ? T("physicalAds")
    : selectedShow;

  backButton.style.display = "inline-block";

  if (!items || items.length === 0) {
    modalContent.innerHTML = `
      <div class="empty-message">${T("noImages")}</div>
    `;
    return;
  }

  let cards = "";

  items.forEach((item, index) => {
    const title = item.title.en
      ? item.title[english ? "en" : "es"]
      : item.title;

    const description = item.description.en
      ? item.description[english ? "en" : "es"]
      : item.description;

    cards += `
      <article class="gallery-card">
        <img
          src="${escapeHTML(item.image)}"
          alt="${escapeHTML(title)}"
          loading="lazy"
          draggable="false"
          onerror="this.style.display='none'; this.nextElementSibling.insertAdjacentHTML('afterbegin','<p style=&quot;color:#a33;font-size:13px&quot;>Image could not be loaded. Check the file path.</p>')"
        >
        <div>
          <h3>${escapeHTML(title)}</h3>
          <p>${escapeHTML(description)}</p>
        </div>
      </article>
    `;
  });

  modalContent.innerHTML = `
    <input
      type="search"
      class="collection-search"
      id="collectionSearch"
      placeholder="${T("searchCollection")}"
      oninput="filterCollection()"
    >

    <div class="gallery" id="galleryGrid">${cards}</div>

    <div class="empty-message" id="galleryEmpty" style="display:none">
      ${T("noResults")}
    </div>
  `;

  window.currentGalleryItems = items;
}

/* =========================================================
   COLLECTION SEARCH
========================================================= */

function filterCollection() {
  const input = document.getElementById("collectionSearch");
  const grid = document.getElementById("galleryGrid");
  const empty = document.getElementById("galleryEmpty");

  if (!input || !grid) return;

  const query = input.value.toLowerCase().trim();
  let visibleCount = 0;

  Array.from(grid.children).forEach(card => {
    const matches = card.textContent.toLowerCase().includes(query);

    card.style.display = matches ? "" : "none";

    if (matches) visibleCount++;
  });

  empty.style.display = visibleCount === 0 ? "block" : "none";
}

/* =========================================================
   GLOBAL SEARCH
========================================================= */

function globalSearch() {
  const query = document.getElementById("archiveSearch").value.toLowerCase().trim();

  if (!query) return;

  const allItems = [];

  physicalAds.forEach(item => {
    allItems.push({
      ...item,
      category: "ads"
    });
  });

  Object.keys(merchCollections).forEach(category => {
    Object.keys(merchCollections[category]).forEach(show => {
      merchCollections[category][show].forEach(item => {
        allItems.push({
          ...item,
          category,
          show
        });
      });
    });
  });

  const matches = allItems.filter(item => {
    const title = item.title.en
      ? item.title.en + " " + item.title.es
      : item.title;

    const description = item.description.en
      ? item.description.en + " " + item.description.es
      : item.description;

    return (
      title.toLowerCase().includes(query) ||
      description.toLowerCase().includes(query) ||
      item.image.toLowerCase().includes(query) ||
      (item.show && item.show.toLowerCase().includes(query))
    );
  });

  selectedSection = "search";
  selectedShow = null;
  currentView = "gallery";

  openModal();

  modalTitle.textContent = english ? "Search Results" : "Resultados de búsqueda";

  if (matches.length === 0) {
    modalContent.innerHTML = `
      <div class="empty-message">${T("noResults")}</div>
    `;
    return;
  }

  renderGallery(matches);
}

/* =========================================================
   VIEW RENDERING
========================================================= */

function renderCurrentView() {
  backButton.style.display =
    ["adsMenu", "merchMenu", "category", "gallery"].includes(currentView)
      ? "inline-block"
      : "none";

  if (currentView === "home") {
    modalTitle.textContent = "Archive";
    modalContent.innerHTML = "";
  }

  if (currentView === "adsMenu") {
    renderAdsMenu();
  }

  if (currentView === "merchMenu") {
    renderMerchMenu();
  }

  if (currentView === "category") {
    renderCategory(selectedSection);
  }

  if (currentView === "gallery") {
    if (selectedSection === "ads") {
      renderGallery(physicalAds);
    } else if (selectedSection === "search") {
      const query = document.getElementById("archiveSearch").value.toLowerCase();

      const allItems = [];

      physicalAds.forEach(item => allItems.push(item));

      Object.keys(merchCollections).forEach(category => {
        Object.keys(merchCollections[category]).forEach(show => {
          merchCollections[category][show].forEach(item => allItems.push(item));
        });
      });

      const matches = allItems.filter(item => {
        const title = item.title.en + " " + item.title.es;
        const description = item.description.en + " " + item.description.es;

        return (
          title.toLowerCase().includes(query) ||
          description.toLowerCase().includes(query) ||
          item.image.toLowerCase().includes(query)
        );
      });

      renderGallery(matches);
    } else if (selectedShow) {
      renderGallery(merchCollections[selectedSection][selectedShow] || []);
    }
  }
}

/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[character]);
}

/* =========================================================
   IMAGE INTERACTION RESTRICTIONS
========================================================= */

document.addEventListener("contextmenu", event => {
  if (event.target.tagName === "IMG") {
    event.preventDefault();
  }
});

document.addEventListener("dragstart", event => {
  if (event.target.tagName === "IMG") {
    event.preventDefault();
  }
});

/* =========================================================
   INITIAL SETUP
========================================================= */

document.getElementById("pageTitle").textContent = T("pageTitle");
document.getElementById("archiveSearch").placeholder = T("search");
document.getElementById("homeButton").textContent = T("home");

</script>
