
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Disney Channel Merchandise Archive</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #101010;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

/* MAIN PAGE */
.page {
    width: 100%;
    min-height: 100vh;
    padding: 25px 15px 35px;
}

/* HEADER */
.archive-header {
    max-width: 1280px;
    margin: 0 auto 20px;
    position: relative;
    text-align: center;
}

.archive-header h1 {
    margin: 0;
    color: #e8f0d9;
    font-size: clamp(22px, 4vw, 38px);
    letter-spacing: 2px;
    text-transform: uppercase;
}

.archive-header p {
    margin: 9px 0 0;
    color: #a3bb89;
    font-size: 11px;
    letter-spacing: 2px;
}

.language-button {
    position: absolute;
    top: 0;
    right: 0;
    padding: 8px 12px;
    background: #30452c;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 4px;
    color: white;
    font-size: 10px;
    cursor: pointer;
}

.language-button:hover {
    background: #496541;
}

/* CABINET BACKGROUND */
.cabinet-stage {
    position: relative;
    width: min(1280px, 100%);
    aspect-ratio: 1280 / 270;
    margin: 0 auto;
    background-image: url("merchandise%20and%20archives.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
}

/* INVISIBLE CLICKABLE SHELVES */
.shelf-hotspot {
    position: absolute;
    top: 3%;
    height: 94%;
    border: 2px solid transparent;
    background: transparent;
    cursor: pointer;
    transition: background .2s, border .2s;
}

.shelf-hotspot:hover {
    background: rgba(120, 144, 95, .13);
    border: 2px solid rgba(180, 205, 145, .65);
}

/* LEFT SIDE: ADS AND COMMERCIALS */
.ads-hotspot {
    left: 12%;
    width: 22%;
}

/* RIGHT SIDE: MERCHANDISE */
.merch-hotspot {
    left: 65%;
    width: 22%;
}

/* LABELS UNDER CABINET */
.shelf-labels {
    width: min(1280px, 100%);
    margin: 15px auto 0;
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

.shelf-label {
    width: 50%;
    padding: 12px;
    text-align: center;
    color: #e8f0d9;
    background: #1b1b1b;
    border-bottom: 2px solid #78905f;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
}

/* BACK BUTTON */
.main-footer {
    max-width: 1280px;
    margin: 25px auto 0;
    text-align: center;
}

.back-home {
    display: inline-block;
    padding: 10px 15px;
    background: #30452c;
    border-left: 3px solid #78905f;
    border-radius: 3px;
    color: #e8f0d9;
    text-decoration: none;
    font-size: 10px;
    font-weight: bold;
}

.back-home:hover {
    background: #496541;
}

/* MODAL BACKGROUND */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    padding: 20px;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.88);
}

.modal.active {
    display: flex;
}

/* MODAL WINDOW */
.modal-window {
    position: relative;
    width: min(900px, 100%);
    max-height: 88vh;
    overflow-y: auto;
    padding: 25px;
    background: #151515;
    border: 1px solid #596e49;
    border-top: 4px solid #78905f;
    box-shadow: 0 0 35px rgba(0,0,0,.8);
}

/* MODAL HEADER */
.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding-bottom: 15px;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,.15);
}

.modal-header h2 {
    margin: 0;
    color: #e8f0d9;
    font-size: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.close-button {
    border: 1px solid rgba(255,255,255,.2);
    background: #30452c;
    color: white;
    padding: 8px 11px;
    cursor: pointer;
    border-radius: 3px;
    font-size: 10px;
}

.close-button:hover {
    background: #496541;
}

/* NAVIGATION BUTTONS */
.archive-buttons {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.archive-button {
    display: block;
    padding: 18px 12px;
    text-align: center;
    background: #222;
    border: 1px solid rgba(255,255,255,.12);
    border-left: 4px solid #78905f;
    color: #e8f0d9;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    transition: background .2s;
}

.archive-button:hover {
    background: #30452c;
}

.archive-button small {
    display: block;
    margin-top: 6px;
    color: #a3bb89;
    font-size: 9px;
    font-weight: normal;
}

/* SHOW BUTTONS */
.show-buttons {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
}

.show-button {
    padding: 15px 8px;
    background: #222;
    border: 1px solid rgba(255,255,255,.12);
    border-left: 3px solid #78905f;
    color: white;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
}

.show-button:hover {
    background: #30452c;
}

/* GALLERY */
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
}

.gallery-card {
    overflow: hidden;
    background: #202020;
    border: 1px solid rgba(255,255,255,.12);
}

.gallery-card img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: contain;
    background: #111;
}

.gallery-caption {
    padding: 10px;
    color: #e8f0d9;
    font-size: 11px;
    text-align: center;
}

.gallery-empty {
    padding: 30px 15px;
    color: #b9c3ae;
    background: #202020;
    border: 1px dashed #596e49;
    text-align: center;
    font-size: 12px;
    line-height: 1.7;
}

.gallery-empty strong {
    display: block;
    margin-bottom: 8px;
    color: #a3bb89;
}

/* MODAL DESCRIPTION */
.modal-description {
    margin: 0 0 18px;
    color: #b9c3ae;
    font-size: 12px;
    line-height: 1.7;
}

.modal-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,.12);
}

.back-button {
    padding: 8px 12px;
    color: white;
    background: #30452c;
    border: 1px solid rgba(255,255,255,.2);
    cursor: pointer;
    border-radius: 3px;
    font-size: 10px;
}

.back-button:hover {
    background: #496541;
}

.archive-count {
    color: #849078;
    font-size: 9px;
}

/* RESPONSIVE */
@media (max-width: 650px) {
    .page {
        padding: 20px 8px;
    }

    .archive-header {
        padding-top: 38px;
    }

    .language-button {
        top: 0;
        right: 0;
    }

    .shelf-label {
        font-size: 8px;
        letter-spacing: 1px;
    }

    .modal-window {
        padding: 15px;
    }

    .show-buttons {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .gallery-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 380px) {
    .archive-buttons {
        grid-template-columns: 1fr;
    }

    .gallery-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- PAGE TITLE -->
    <header class="archive-header">

        <button
            class="language-button"
            id="languageButton"
            onclick="toggleLanguage()">
            ESPAÑOL
        </button>

        <h1 id="pageTitle">
            Disney Channel Merchandise Archive
        </h1>

        <p id="pageSubtitle">
            A COLLECTION OF DISNEY CHANNEL MERCHANDISE AND ADVERTISING
        </p>

    </header>

    <!-- CABINET BACKGROUND -->
    <main>

        <div class="cabinet-stage">

            <!-- LEFT SHELF -->
            <button
                class="shelf-hotspot ads-hotspot"
                onclick="openAdsMenu()"
                aria-label="Advertising archive">
            </button>

            <!-- RIGHT SHELF -->
            <button
                class="shelf-hotspot merch-hotspot"
                onclick="openMerchMenu()"
                aria-label="Merchandise collections">
            </button>

        </div>

        <div class="shelf-labels">

            <div class="shelf-label" id="adsLabel">
                ADVERTISEMENTS & COMMERCIALS
            </div>

            <div class="shelf-label" id="merchLabel">
                MERCHANDISE COLLECTIONS
            </div>

        </div>

    </main>

    <!-- RETURN HOME -->
    <footer class="main-footer">
        <a class="back-home" id="homeButton" href="index.html">
            BACK TO THE LIVING ROOM
        </a>
    </footer>

</div>


<!-- INTERACTIVE ARCHIVE WINDOW -->
<div class="modal" id="archiveModal">

    <div class="modal-window">

        <div class="modal-header">

            <h2 id="modalTitle">ARCHIVE</h2>

            <button
                class="close-button"
                onclick="closeModal()"
                id="closeButton">
                CLOSE ✕
            </button>

        </div>

        <div id="modalContent"></div>

    </div>

</div>


<script>

/* =========================================
   ARCHIVE CONTENT CONFIGURATION
   ADD YOUR IMAGES AND PLAYLISTS HERE
========================================= */


/* PHYSICAL ADVERTISEMENTS

   Add image files to your repository.
   Example:
   { src: "merch/ads/hannah-ad-01.jpg",
     title: "Hannah Montana Magazine Advertisement" }

*/

const physicalAds = [

    // ADD YOUR SCANNED ADVERTISEMENTS HERE

];


/* COMMERCIALS YOUTUBE PLAYLIST

   Paste your YouTube playlist URL between the quotes.
*/

const commercialPlaylist = "";


/* MERCHANDISE COLLECTIONS

   Each show has its own image gallery.

   Example:
   "Hannah Montana": [
       {
           src: "merch/hannah/doll.jpg",
           title: "Hannah Montana Doll"
       }
   ]

*/

const merchCollections = {

    "Hannah Montana": [

        // ADD HANNAH MONTANA MERCHANDISE HERE

    ],

    "That's So Raven": [

        // ADD THAT'S SO RAVEN MERCHANDISE HERE

    ],

    "Kim Possible": [

        // ADD KIM POSSIBLE MERCHANDISE HERE

    ],

    "Wizards of Waverly Place": [

        // ADD WIZARDS MERCHANDISE HERE

    ],

    "The Proud Family": [

        // ADD PROUD FAMILY MERCHANDISE HERE

    ],

    "Camp Rock": [

        // ADD CAMP ROCK MERCHANDISE HERE

    ],

    "High School Musical": [

        // ADD HIGH SCHOOL MUSICAL MERCHANDISE HERE

    ],

    "The Cheetah Girls": [

        // ADD CHEETAH GIRLS MERCHANDISE HERE

    ]

};


/* =========================================
   LANGUAGE SETTINGS
========================================= */

let english = true;
let currentView = "home";
let selectedShow = "";


/* TRANSLATIONS */

const translations = {

    en: {
        title: "Disney Channel Merchandise Archive",
        subtitle: "A COLLECTION OF DISNEY CHANNEL MERCHANDISE AND ADVERTISING",
        ads: "ADVERTISEMENTS & COMMERCIALS",
        merch: "MERCHANDISE COLLECTIONS",
        home: "BACK TO THE LIVING ROOM",
        close: "CLOSE ✕",
        back: "BACK",
        adsTitle: "ADVERTISEMENTS & COMMERCIALS",
        adsDescription: "Explore scanned physical advertisements and original Disney Channel commercials.",
        physical: "PHYSICAL ADVERTISEMENTS",
        physicalDescription: "Scanned magazines, catalogs, promotional materials and printed advertisements.",
        commercials: "TELEVISION COMMERCIALS",
        commercialsDescription: "Watch archived Disney Channel commercials and promotional spots.",
        merchTitle: "MERCHANDISE COLLECTIONS",
        merchDescription: "Explore merchandise collections organized by Disney Channel show.",
        emptyTitle: "COLLECTION UNDER CONSTRUCTION",
        emptyText: "This section is waiting for its archived materials. New items will be added soon.",
        emptyAds: "No scanned advertisements have been added yet.",
        emptyCommercials: "The YouTube playlist has not been connected yet.",
        playlist: "OPEN YOUTUBE PLAYLIST",
        playlistMissing: "Add your YouTube playlist URL in the configuration section of this code.",
        itemCount: "ARCHIVED ITEMS",
        shows: {
            "Hannah Montana": "HANNAH MONTANA",
            "That's So Raven": "THAT'S SO RAVEN",
            "Kim Possible": "KIM POSSIBLE",
            "Wizards of Waverly Place": "WIZARDS OF WAVERLY PLACE",
            "The Proud Family": "THE PROUD FAMILY",
            "Camp Rock": "CAMP ROCK",
            "High School Musical": "HIGH SCHOOL MUSICAL",
            "The Cheetah Girls": "THE CHEETAH GIRLS"
        }
    },

    es: {
        title: "Archivo de Merchandising de Disney Channel",
        subtitle: "UNA COLECCIÓN DE PRODUCTOS Y PUBLICIDAD DE DISNEY CHANNEL",
        ads: "ANUNCIOS Y COMERCIALES",
        merch: "COLECCIONES DE MERCHANDISING",
        home: "VOLVER AL LIVING",
        close: "CERRAR ✕",
        back: "VOLVER",
        adsTitle: "ANUNCIOS Y COMERCIALES",
        adsDescription: "Explora anuncios físicos digitalizados y comerciales originales de Disney Channel.",
        physical: "ANUNCIOS FÍSICOS",
        physicalDescription: "Revistas, catálogos, material promocional y anuncios impresos digitalizados.",
        commercials: "COMERCIALES DE TELEVISIÓN",
        commercialsDescription: "Mira comerciales y promociones archivados de Disney Channel.",
        merchTitle: "COLECCIONES DE MERCHANDISING",
        merchDescription: "Explora colecciones de productos organizadas por serie o película de Disney Channel.",
        emptyTitle: "COLECCIÓN EN CONSTRUCCIÓN",
        emptyText: "Esta sección está esperando sus materiales de archivo. Pronto se agregarán nuevos artículos.",
        emptyAds: "Todavía no se han agregado anuncios digitalizados.",
        emptyCommercials: "La lista de reproducción de YouTube aún no está conectada.",
        playlist: "ABRIR LISTA DE YOUTUBE",
        playlistMissing: "Agrega el enlace de tu lista de YouTube en la sección de configuración de este código.",
        itemCount: "ARTÍCULOS ARCHIVADOS",
        shows: {
            "Hannah Montana": "HANNAH MONTANA",
            "That's So Raven": "ES TAN RAVEN",
            "Kim Possible": "KIM POSSIBLE",
            "Wizards of Waverly Place": "LOS HECHICEROS DE WAVERLY PLACE",
            "The Proud Family": "LA FAMILIA PROUD",
            "Camp Rock": "CAMP ROCK",
            "High School Musical": "HIGH SCHOOL MUSICAL",
            "The Cheetah Girls": "LAS CHEETAH GIRLS"
        }
    }

};


/* =========================================
   LANGUAGE SWITCHER
========================================= */

function toggleLanguage() {

    english = !english;

    const t = english ? translations.en : translations.es;

    document.documentElement.lang = english ? "en" : "es";

    document.getElementById("languageButton").textContent =
        english ? "ESPAÑOL" : "ENGLISH";

    document.getElementById("pageTitle").textContent = t.title;
    document.getElementById("pageSubtitle").textContent = t.subtitle;
    document.getElementById("adsLabel").textContent = t.ads;
    document.getElementById("merchLabel").textContent = t.merch;
    document.getElementById("homeButton").textContent = t.home;
    document.getElementById("closeButton").textContent = t.close;

    if (currentView !== "home") {
        renderCurrentView();
    }

}


/* =========================================
   MODAL FUNCTIONS
========================================= */

function openModal() {
    document.getElementById("archiveModal").classList.add("active");
}

function closeModal() {
    document.getElementById("archiveModal").classList.remove("active");
    currentView = "home";
}

function getTranslations() {
    return english ? translations.en : translations.es;
}


/* =========================================
   LEFT SIDE: ADVERTISEMENTS
========================================= */

function openAdsMenu() {

    currentView = "ads";
    openModal();
    renderCurrentView();

}

function openPhysicalAds() {

    currentView = "physical";
    renderCurrentView();

}

function openCommercials() {

    if (commercialPlaylist.trim()) {

        window.open(commercialPlaylist, "_blank", "noopener");

    } else {

        currentView = "commercials";
        renderCurrentView();

    }

}


/* =========================================
   RIGHT SIDE: MERCHANDISE
========================================= */

function openMerchMenu() {

    currentView = "merch";
    openModal();
    renderCurrentView();

}

function openShow(show) {

    selectedShow = show;
    currentView = "show";
    renderCurrentView();

}


/* =========================================
   GALLERY RENDERING
========================================= */

function escapeHTML(value) {

    return String(value).replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];
    });

}

function renderGallery(items, emptyMessage) {

    if (!items || items.length === 0) {

        return `
            <div class="gallery-empty">
                <strong>${getTranslations().emptyTitle}</strong>
                ${emptyMessage}
            </div>
        `;

    }

    return `
        <div class="gallery-grid">
            ${items.map(function(item) {

                return `
                    <div class="gallery-card">

                        <img
                            src="${escapeHTML(item.src)}"
                            alt="${escapeHTML(item.title || "Archived merchandise")}"
                            loading="lazy">

                        <div class="gallery-caption">
                            ${escapeHTML(item.title || "")}
                        </div>

                    </div>
                `;

            }).join("")}
        </div>
    `;

}


/* =========================================
   VIEW NAVIGATION
========================================= */

function goBack() {

    if (currentView === "physical" || currentView === "commercials") {
        currentView = "ads";

    } else if (currentView === "show") {
        currentView = "merch";

    } else {
        currentView = "home";
        closeModal();
        return;
    }

    renderCurrentView();

}


/* =========================================
   DISPLAY CURRENT VIEW
========================================= */

function renderCurrentView() {

    const t = getTranslations();

    const title = document.getElementById("modalTitle");
    const content = document.getElementById("modalContent");

    if (currentView === "ads") {

        title.textContent = t.adsTitle;

        content.innerHTML = `

            <p class="modal-description">
                ${t.adsDescription}
            </p>

            <div class="archive-buttons">

                <button
                    class="archive-button"
                    onclick="openPhysicalAds()">
                    ${t.physical}
                    <small>${t.physicalDescription}</small>
                </button>

                <button
                    class="archive-button"
                    onclick="openCommercials()">
                    ${t.commercials}
                    <small>${t.commercialsDescription}</small>
                </button>

            </div>

        `;

    }

    else if (currentView === "physical") {

        title.textContent = t.physical;

        content.innerHTML = `

            <p class="modal-description">
                ${t.physicalDescription}
            </p>

            ${renderGallery(physicalAds, t.emptyAds)}

            <div class="modal-footer">
                <button class="back-button" onclick="goBack()">
                    ← ${t.back}
                </button>

                <span class="archive-count">
                    ${physicalAds.length} ${t.itemCount}
                </span>
            </div>

        `;

    }

    else if (currentView === "commercials") {

        title.textContent = t.commercials;

        content.innerHTML = `

            <div class="gallery-empty">
                <strong>${t.emptyTitle}</strong>
                ${t.playlistMissing}
            </div>

            <div class="modal-footer">
                <button class="back-button" onclick="goBack()">
                    ← ${t.back}
                </button>
            </div>

        `;

    }

    else if (currentView === "merch") {

        title.textContent = t.merchTitle;

        content.innerHTML = `

            <p class="modal-description">
                ${t.merchDescription}
            </p>

            <div class="show-buttons">

                ${Object.keys(merchCollections).map(function(show) {

                    return `
                        <button
                            class="show-button"
                            onclick="openShow('${escapeHTML(show)}')">
                            ${t.shows[show] || escapeHTML(show)}
                        </button>
                    `;

                }).join("")}

            </div>

        `;

    }

    else if (currentView === "show") {

        title.textContent = t.shows[selectedShow] || selectedShow;

        const items = merchCollections[selectedShow] || [];

        content.innerHTML = `

            <p class="modal-description">
                ${t.merchDescription}
            </p>

            ${renderGallery(items, t.emptyText)}

            <div class="modal-footer">

                <button class="back-button" onclick="goBack()">
                    ← ${t.back}
                </button>

                <span class="archive-count">
                    ${items.length} ${t.itemCount}
                </span>

            </div>

        `;

    }

}


/* CLOSE MODAL WHEN CLICKING OUTSIDE */

document.getElementById("archiveModal").addEventListener("click", function(event) {

    if (event.target === this) {
        closeModal();
    }

});


/* ESCAPE KEY */

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        closeModal();
    }

});

</script>

</body>
</html>
