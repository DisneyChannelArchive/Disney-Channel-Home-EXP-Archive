<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merchandise Archive — Disney Channel Home EXP Archive</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f1e8;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 35px 7%;
}

main {
    max-width: 1200px;
    margin: auto;
    padding: 40px 7%;
}

.search {
    width: 100%;
    padding: 15px;
    font-size: 17px;
    border: 1px solid #bbb;
    border-radius: 8px;
    margin-bottom: 25px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
}

.item {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 22px;
}

.item h2 {
    margin-top: 0;
}

.meta {
    color: #666;
    line-height: 1.6;
}
</style>
</head>

<body>

<header>
    <h1>Merchandise Archive</h1>
    <p>Clothing, stationery, toys, collectibles, household items and more.</p>
</header>

<main>

<input
    id="search"
    class="search"
    type="search"
    placeholder="Search the merchandise archive..."
>

<div id="results" class="grid"></div>

</main>

<script>

let records = [];

async function loadArchive() {

    const response = await fetch("data/merch.json");

    records = await response.json();

    displayRecords(records);
}

function displayRecords(items) {

    const results = document.getElementById("results");

    results.innerHTML = "";

    if (items.length === 0) {
        results.innerHTML = "<p>No records found.</p>";
        return;
    }

    items.forEach(item => {

        const card = document.createElement("article");

        card.className = "item";

        card.innerHTML = `
            <h2>${item.name || "Merchandise Record"}</h2>

            <div class="meta">
                <strong>Archive ID:</strong> ${item.id}<br>
                <strong>Type:</strong> ${item.type || ""}<br>
                <strong>Season / Movie:</strong> ${item.seasonOrMovie || ""}<br>
                <strong>Condition:</strong> ${item.condition || ""}
            </div>

            <p>${item.additionalInfo || ""}</p>
        `;

        results.appendChild(card);

    });
}

document.getElementById("search").addEventListener("input", function() {

    const query = this.value.toLowerCase();

    const filtered = records.filter(item =>
        JSON.stringify(item).toLowerCase().includes(query)
    );

    displayRecords(filtered);

});

loadArchive();

</script>

</body>
</html>
