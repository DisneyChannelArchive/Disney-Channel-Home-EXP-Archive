<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Merchandise — Disney Channel Home EXP Archive</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(circle at 50% 20%, rgba(255,255,255,.08), transparent 35%),
        linear-gradient(#191919, #080808);

    min-height: 100vh;
}


/* =====================================================
   TOP
===================================================== */

.top {
    padding: 55px 7% 35px;
    text-align: center;
}

.top h1 {
    margin: 0;

    font-size: clamp(42px, 8vw, 82px);

    font-weight: 900;

    letter-spacing: -4px;

    text-transform: uppercase;

    text-shadow:
        4px 4px 0 #000;
}

.top p {
    margin: 12px auto 0;

    max-width: 650px;

    color: #cfcfcf;

    font-size: 16px;

    line-height: 1.6;
}


/* =====================================================
   ROOM
===================================================== */

.room {

    width: min(1500px, 94%);

    margin: 20px auto 80px;

    padding: 35px 25px 55px;

    position: relative;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.025),
            transparent 20%,
            transparent 80%,
            rgba(255,255,255,.025)
        ),
        #242424;

    box-shadow:
        inset 0 0 80px rgba(0,0,0,.8),
        0 20px 60px rgba(0,0,0,.6);
}


/* =====================================================
   SHELF
===================================================== */

.shelf-section {
    margin: 0 auto 70px;

    max-width: 1300px;
}

.shelf-label {

    margin: 0 0 12px 10px;

    color: #d7d7d7;

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 2px;

    text-transform: uppercase;
}


/* Wooden back */

.shelf {

    position: relative;

    min-height: 240px;

    padding:
        25px
        25px
        30px;

    display: flex;

    align-items: flex-end;

    gap: 22px;

    flex-wrap: wrap;

    background:

        linear-gradient(
            90deg,
            rgba(255,255,255,.04),
            transparent 50%,
            rgba(0,0,0,.12)
        ),

        linear-gradient(
            #633b20,
            #472914
        );

    border-radius:
        8px 8px 3px 3px;

    box-shadow:

        inset 0 8px 0 rgba(255,255,255,.06),

        inset 0 -15px 25px rgba(0,0,0,.3),

        0 14px 0 #2b180d,

        0 18px 25px rgba(0,0,0,.5);
}


/* Shelf surface */

.shelf::after {

    content: "";

    position: absolute;

    left: -8px;
    right: -8px;

    bottom: -18px;

    height: 20px;

    border-radius: 4px;

    background:
        linear-gradient(
            #7b4b29,
            #4b2b17
        );

    box-shadow:
        0 5px 0 #201208,
        0 10px 15px rgba(0,0,0,.5);
}


/* =====================================================
   MERCH ITEM
===================================================== */

.item {

    position: relative;

    width: 125px;

    min-height: 155px;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    cursor: pointer;

    transition:
        transform .2s ease,
        filter .2s ease;

    z-index: 2;
}


.item:hover {

    transform:
        translateY(-12px)
        scale(1.04);

    filter:
        drop-shadow(
            0 12px 12px
            rgba(0,0,0,.6)
        );
}


.item img {

    display: block;

    max-width: 125px;

    max-height: 165px;

    width: auto;

    height: auto;

    object-fit: contain;

    border-radius: 4px;

    filter:
        drop-shadow(
            0 5px 5px
            rgba(0,0,0,.5)
        );
}


/* =====================================================
   ITEM NUMBER
===================================================== */

.item-number {

    position: absolute;

    top: -8px;

    left: -5px;

    width: 25px;

    height: 25px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background: #fff;

    color: #111;

    font-size: 11px;

    font-weight: bold;

    opacity: 0;

    transition: opacity .2s;

    box-shadow:
        0 3px 5px rgba(0,0,0,.4);
}

.item:hover .item-number {
    opacity: 1;
}


/* =====================================================
   EMPTY SHELF
===================================================== */

.empty {

    color: rgba(255,255,255,.4);

    font-size: 13px;

    font-style: italic;

    padding: 20px;
}


/* =====================================================
   VIEWER
===================================================== */

.viewer {

    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 30px;

    background:
        rgba(0,0,0,.94);

    backdrop-filter:
        blur(8px);
}


.viewer.active {
    display: flex;
}


.viewer-content {

    max-width: 900px;

    width: 100%;

    max-height: 92vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;
}


.viewer img {

    max-width: 90vw;

    max-height: 80vh;

    width: auto;

    height: auto;

    object-fit: contain;

    border-radius: 6px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.8);
}


.viewer-caption {

    margin-top: 18px;

    color: #ddd;

    font-size: 14px;

    text-align: center;
}


.close {

    position: fixed;

    top: 22px;

    right: 28px;

    width: 45px;

    height: 45px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background: rgba(255,255,255,.12);

    color: white;

    font-size: 30px;

    cursor: pointer;

    transition:
        background .2s;
}


.close:hover {
    background: rgba(255,255,255,.25);
}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    padding: 30px;

    text-align: center;

    color: #777;

    font-size: 12px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 650px) {

    .top {
        padding-top: 35px;
    }

    .top h1 {
        letter-spacing: -2px;
    }

    .room {
        width: 96%;
        padding: 25px 12px 45px;
    }

    .shelf {
        padding: 20px 12px 25px;

        gap: 14px;

        justify-content: center;
    }

    .item {
        width: 90px;
        min-height: 130px;
    }

    .item img {
        max-width: 90px;
        max-height: 135px;
    }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

    * {
        scroll-behavior: auto !important;
        transition: none !important;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="top">

    <h1>Merchandise</h1>

    <p>
        Physical objects preserved in the
        Disney Channel Home EXP Archive.
    </p>

</header>



<!-- =====================================================
     ARCHIVE ROOM
===================================================== -->

<main class="room">


    <!-- SHELF 1 -->

    <section class="shelf-section">

        <div class="shelf-label">
            Collection — 01
        </div>

        <div class="shelf" id="shelf-1">

            <!--
                PUT YOUR CLOUDINARY IMAGES HERE.

                Duplicate an .item whenever you
                want to add another object.
            -->


            <div class="item"
                 onclick="openViewer(this)">

                <span class="item-number">
                    1
                </span>

                <img
                    src="PASTE-CLOUDINARY-URL-HERE"
                    alt="Disney Channel merchandise"
                >

            </div>


            <div class="item"
                 onclick="openViewer(this)">

                <span class="item-number">
                    2
                </span>

                <img
                    src="PASTE-CLOUDINARY-URL-HERE"
                    alt="Disney Channel merchandise"
                >

            </div>


            <div class="item"
                 onclick="openViewer(this)">

                <span class="item-number">
                    3
                </span>

                <img
                    src="PASTE-CLOUDINARY-URL-HERE"
                    alt="Disney Channel merchandise"
                >

            </div>


            <div class="item"
                 onclick="openViewer(this)">

                <span class="item-number">
                    4
                </span>

                <img
                    src="PASTE-CLOUDINARY-URL-HERE"
                    alt="Disney Channel merchandise"
                >

            </div>


            <div class="item"
                 onclick="openViewer(this)">

                <span class="item-number">
                    5
                </span>

                <img
                    src="PASTE-CLOUDINARY-URL-HERE"
                    alt="Disney Channel merchandise"
                >

            </div>


        </div>

    </section>



    <!-- SHELF 2 -->

    <section class="shelf-section">

        <div class="shelf-label">
            Collection — 02
        </div>

        <div class="shelf" id="shelf-2">

            <div class="empty">
                More objects from the collection will be preserved here.
            </div>

        </div>

    </section>



    <!-- SHELF 3 -->

    <section class="shelf-section">

        <div class="shelf-label">
            Collection — 03
        </div>

        <div class="shelf" id="shelf-3">

            <div class="empty">
                Archive in progress.
            </div>

        </div>

    </section>


</main>



<footer class="footer">

    Disney Channel Home EXP Archive

</footer>



<!-- =====================================================
     IMAGE VIEWER
===================================================== -->

<div
    class="viewer"
    id="viewer"
>

    <button
        class="close"
        onclick="closeViewer()"
        aria-label="Close"
    >
        ×
    </button>


    <div class="viewer-content">

        <img
            id="viewer-image"
            src=""
            alt=""
        >

        <div
            class="viewer-caption"
            id="viewer-caption"
        ></div>

    </div>

</div>



<script>

/* =====================================================
   IMAGE VIEWER
===================================================== */

function openViewer(item) {

    const image =
        item.querySelector("img");

    const viewer =
        document.getElementById(
            "viewer"
        );

    const viewerImage =
        document.getElementById(
            "viewer-image"
        );

    const caption =
        document.getElementById(
            "viewer-caption"
        );


    viewerImage.src =
        image.src;


    viewerImage.alt =
        image.alt;


    caption.textContent =
        image.alt;


    viewer.classList.add(
        "active"
    );

}


function closeViewer() {

    document
        .getElementById("viewer")
        .classList.remove(
            "active"
        );

}


/* Close when clicking outside */

document
    .getElementById("viewer")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeViewer();

            }

        }
    );


/* Escape key */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeViewer();

        }

    }
);

</script>


</body>
</html>
