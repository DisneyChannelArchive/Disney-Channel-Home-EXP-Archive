<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #101010;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

body { overflow-x: hidden; }

.page {
    width: 100%;
    min-height: 100vh;
    padding: 25px 12px 35px;
}

.archive-header {
    width: min(1450px, 100%);
    margin: 0 auto 22px;
    position: relative;
    text-align: center;
    padding: 0 100px;
}

.archive-header h1 {
    margin: 0;
    color: #e8f0d9;
    font-size: clamp(22px, 4vw, 38px);
    letter-spacing: 2px;
    text-transform: uppercase;
}

.language-button {
    position: absolute;
    top: 0;
    right: 0;
    padding: 8px 12px;
    background: #30452c;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 4px;
    color: white;
    font-size: 10px;
    cursor: pointer;
}

.language-button:hover,
.back-home:hover,
.archive-button:hover,
.show-button:hover,
.close-button:hover,
.back-button:hover {
    background: #496541;
}

.search-container {
    width: min(650px, 100%);
    margin: 17px auto 0;
}

.search-bar, .collection-search {
    width: 100%;
    padding: 12px 15px;
    background: #1b1b1b;
    border: 1px solid #596e49;
    border-left: 3px solid #78905f;
    border-radius: 3px;
    color: white;
    font-size: 12px;
    outline: none;
}

.search-bar:focus, .collection-search:focus {
    border-color: #a3bb89;
}

.search-bar::placeholder, .collection-search::placeholder {
    color: #9ba591;
}

/* CABINET BACKGROUND */
.cabinet-stage {
    position: relative;
    width: min(1600px, 100%);
    aspect-ratio: 1280 / 270;
    margin: 0 auto;
    background-image: url("merchandise%20and%20archives.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
}

.shelf-hotspot {
    position: absolute;
    top: 2%;
    height: 96%;
    border: 2px solid transparent;
    background: transparent;
    cursor: pointer;
    transition: background .2s, border .2s;
}

.shelf-hotspot:hover,
.shelf-hotspot:focus-visible {
    background: rgba(120,144,95,.13);
    border: 2px solid rgba(180,205,145,.65);
    outline: none;
}

.ads-hotspot {
    left: 12%;
    width: 22%;
}

.merch-hotspot {
    left: 65%;
    width: 22%;
}

.main-footer {
    max-width: 1400px;
    margin: 28px auto 0;
    text-align: center;
}

.back-home {
    display: inline-block;
    padding: 10px 15px;
    background: #30452c;
    border-left: 3px solid #78905f;
    border-radius: 3px;
    color: #e8f0d9;
    text-decoration: none;
    font-size: 10px;
    font-weight: bold;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    padding: 18px;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.90);
}

.modal.active { display: flex; }

.modal-window {
    position: relative;
    width: min(1000px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    padding: 25px;
    background: #151515;
    border: 1px solid #596e49;
    border-top: 4px solid #78905f;
    box-shadow: 0 0 35px rgba(0,0,0,.8);
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding-bottom: 15px;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,.15);
}

.modal-header h2 {
    margin: 0;
    color: #e8f0d9;
    font-size: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.close-button, .back-button {
    padding: 8px 11px;
    background: #30452c;
    border: 1px solid rgba(255,255,255,.2);
    color: white;
    border-radius: 3px;
    font-size: 10px;
    cursor: pointer;
}

.modal-description {
    margin: 0 0 18px;
    color: #b9c3ae;
    font-size: 12px;
    line-height: 1.7;
}

.archive-buttons {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 12px;
}

.archive-button {
    display: block;
    padding: 22px 15px;
    text-align: left;
    background: #222;
    border: 1px solid rgba(255,255,255,.12);
    border-left: 4px solid #78905f;
    color: #e8f0d9;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    text-decoration: none;
    transition: background .2s;
}

.archive-button small {
    display: block;
    margin-top: 8px;
    color: #a3bb89;
    font-size: 10px;
    font-weight: normal;
    line-height: 1.5;
}

.category-section { margin-bottom: 25px; }

.category-title {
    margin: 0 0 12px;
    padding-bottom: 7px;
    color: #a3bb89;
    font-size: 13px;
    letter-spacing: 2px;
    border-bottom: 1px solid #596e49;
}

.show-buttons {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 10px;
}

.show-button {
    min-height: 48px;
    padding: 12px 8px;
    background: #222;
    border: 1px solid rgba(255,255,255,.12);
    border-left: 3px solid #78905f;
    color: white;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    transition: background .2s;
}

.show-button.hidden { display: none; }

.collection-search { margin: 0 0 18px; }

/* GALLERY */
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 14px;
}

.gallery-card {
    overflow: hidden;
    background: #202020;
    border: 1px solid rgba(255,255,255,.12);
}

.gallery-card img {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: contain;
    background: #111;
    user-select: none;
    -webkit-user-drag: none;
}

.gallery-caption {
    padding: 10px;
    color: #e8f0d9;
    font-size: 11px;
    font-weight: bold;
    text-align: center;
}

.gallery-description {
    padding: 0 12px 13px;
    color: #b9c3ae;
    font-size: 10px;
    line-height: 1.6;
    text-align: center;
}

.gallery-card.hidden { display: none; }

.gallery-empty {
    padding: 30px 15px;
    color: #b9c3ae;
    background: #202020;
    border: 1px dashed #596e49;
    text-align: center;
    font-size: 12px;
    line-height: 1.7;
}

.gallery-empty strong {
    display: block;
    margin-bottom: 8px;
    color: #a3bb89;
}

.modal-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 22px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,.12);
}

.archive-count {
    color: #849078;
    font-size: 9px;
}

@media (max-width: 650px) {
    .page { padding: 18px 8px 25px; }
    .archive-header { padding: 42px 0 0; }
    .language-button { top: 0; right: 0; }
    .cabinet-stage { width: 100%; }
    .modal-window { padding: 15px; }
    .show-buttons { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .gallery-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
}

@media (max-width: 380px) {
    .archive-buttons, .gallery-grid { grid-template-columns: 1fr; }
}
</style>

========================================= */

let english = true;
let currentView = "home";
let selectedSection = "";
let selectedShow = "";

function getT() {
    return english ? translations.en : translations.es;
}

function toggleLanguage() {
    english = !english;
    const t = getT();

    document.documentElement.lang = english ? "en" : "es";
    document.getElementById("languageButton").textContent =
        english ? "ESPAÑOL" : "ENGLISH";

    document.getElementById("pageTitle").textContent = t.title;
    document.getElementById("archiveSearch").placeholder = t.search;
    document.getElementById("homeButton").textContent = t.home;
    document.getElementById("homeButton").href = english
        ? "https://disneyrocklover.itch.io/disneychannelhomeexparchive"
        : "https://disneyrocklover.itch.io/lacasaexpdisneychannelarchivo";

    document.getElementById("closeButton").textContent = t.close;

    if (currentView !== "home") renderCurrentView();
}


/* =========================================
   MODAL CONTROLS
========================================= */

function openModal() {
    document.getElementById("archiveModal").classList.add("active");
}

function closeModal() {
    document.getElementById("archiveModal").classList.remove("active");
    currentView = "home";
}

function setTitle(title) {
    document.getElementById("modalTitle").textContent = title;
}


/* =========================================
   SEARCH
========================================= */

function globalSearch() {
    const query = document.getElementById("archiveSearch")
        .value.trim().toLowerCase();

    if (!query) {
        if (currentView === "global-search") closeModal();
        return;
    }

    currentView = "global-search";
    openModal();
    renderCurrentView();
}

function filterCollection() {
    const input = document.getElementById("collectionSearch");
    if (!input) return;

    const query = input.value.toLowerCase().trim();
    const cards = document.querySelectorAll(".gallery-card");
    let visible = 0;

    cards.forEach(card => {
        const matches = card.dataset.search.includes(query);
        card.classList.toggle("hidden", !matches);
        if (matches) visible++;
    });

    let noResults = document.getElementById("noResults");

    if (!noResults && cards.length > 0) {
        noResults = document.createElement("div");
        noResults.id = "noResults";
        noResults.className = "gallery-empty";
        document.getElementById("galleryGrid").after(noResults);
    }

    if (noResults) {
        noResults.textContent = getT().noResults;
        noResults.style.display = visible === 0 ? "block" : "none";
    }
}


/* =========================================
   NAVIGATION
========================================= */

function openAdsMenu() {
    currentView = "ads";

function openPhysicalAds() {
    currentView = "physical";

}

function openMerchMenu() {
    currentView = "merch";

function openCollection(section, show) {
    selectedSection = section;
    selectedShow = show;
    currentView = "collection";
    renderCurrentView();
}

function goBack() {
    if (currentView === "physical") {
        currentView = "ads";
    } else if (currentView === "collection") {
        currentView = "merch";
    } else {
        closeModal();
        return;
    }

    renderCurrentView();
}


/* =========================================
   SAFE HTML
========================================= */

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    }[char]));
}


/* =========================================
   GALLERY
========================================= */

function renderGallery(items, emptyMessage) {
    const t = getT();

    if (!items || items.length === 0) {
        return `
            <div class="gallery-empty">
                <strong>${t.emptyTitle}</strong>
                ${emptyMessage}
            </div>
        `;
    }

    return `
        <div class="gallery-grid" id="galleryGrid">
            ${items.map(item => {
                const title = item.title
                    ? (typeof item.title === "object"
                        ? item.title[english ? "en" : "es"]
                        : item.title)
                    : "";

                const description = item.description
                    ? (typeof item.description === "object"
                        ? item.description[english ? "en" : "es"]
                        : item.description)
                    : "";

                return `
                    <div class="gallery-card"
                         data-search="${escapeHTML((title + " " + description).toLowerCase())}">
                        <img src="${escapeHTML(item.src)}"
                             alt="${escapeHTML(title || "Archived item")}"
                             loading="lazy"
                             draggable="false"
                             oncontextmenu="return false">

                        <div class="gallery-caption">${escapeHTML(title)}</div>

                        ${description ? `
                            <div class="gallery-description">
                                ${escapeHTML(description)}
                            </div>
                        ` : ""}
                    </div>
                `;
            }).join("")}
        </div>
    `;
}


/* =========================================
   RENDER ARCHIVE
========================================= */

function renderCurrentView() {
    const t = getT();
    const content = document.getElementById("modalContent");

    if (currentView === "ads") {
        setTitle(t.adsTitle);

        content.innerHTML = `
            <p class="modal-description">${t.adsDescription}</p>

            <div class="archive-buttons">
                <button class="archive-button" onclick="openPhysicalAds()">
                    ${t.physical}
                    <small>${t.physicalDescription}</small>
                </button>

                <a class="archive-button"
                   href="${lostMediaPlaylist}"
                   target="_blank"
                   rel="noopener">
                    ${t.lost}
                    <small>${t.lostDescription}</small>
                </a>
            </div>
        `;
    }

    else if (currentView === "physical") {
        setTitle(t.physicalTitle);

        content.innerHTML = `
            ${renderGallery(physicalAds, t.emptyAds)}

            <div class="modal-footer">
                <button class="back-button" onclick="goBack()">← ${t.back}</button>
                <span class="archive-count">${physicalAds.length} ${t.itemCount}</span>
            </div>
        `;
    }

    else if (currentView === "merch") {
        setTitle(t.merchTitle);

        const query = document.getElementById("archiveSearch")
            .value.toLowerCase().trim();

        content.innerHTML = `
            <p class="modal-description">${t.merchDescription}</p>

            <section class="category-section">
                <h3 class="category-title">${t.series}</h3>
                <div class="show-buttons">
                    ${Object.keys(merchCollections.series).map(show => {
                        const name = showNames[english ? "en" : "es"][show];
                        const matches = (show + " " + name).toLowerCase().includes(query);

                        return `
                            <button class="show-button ${matches ? "" : "hidden"}"
                                onclick="openCollection('series','${escapeHTML(show)}')">
                                ${escapeHTML(name)}
                            </button>
                        `;
                    }).join("")}
                </div>
            </section>

            <section class="category-section">
                <h3 class="category-title">${t.movies}</h3>
                <div class="show-buttons">
                    ${Object.keys(merchCollections.movies).map(show => {
                        const name = showNames[english ? "en" : "es"][show];
                        const matches = (show + " " + name).toLowerCase().includes(query);

                        return `
                            <button class="show-button ${matches ? "" : "hidden"}"
                                onclick="openCollection('movies','${escapeHTML(show)}')">
                                ${escapeHTML(name)}
                            </button>
                        `;
                    }).join("")}
                </div>
            </section>
        `;
    }

    else if (currentView === "collection") {
        const items = merchCollections[selectedSection][selectedShow] || [];
        const translatedName =
            showNames[english ? "en" : "es"][selectedShow] || selectedShow;

        setTitle(translatedName);

        content.innerHTML = `
            <p class="modal-description">${t.merchDescription}</p>

            <input type="search"
                class="collection-search"
                id="collectionSearch"
                placeholder="${t.collectionSearch}"
                oninput="filterCollection()">

            <div id="collectionGallery">
                ${renderGallery(items, t.emptyText)}
            </div>

            <div class="modal-footer">
                <button class="back-button" onclick="goBack()">← ${t.back}</button>
                <span class="archive-count">${items.length} ${t.itemCount}</span>
            </div>
        `;
    }

    else if (currentView === "global-search") {
        setTitle(t.merchTitle);

        const query = document.getElementById("archiveSearch")
            .value.toLowerCase().trim();

        const allShows = [
            ...Object.keys(merchCollections.series),
            ...Object.keys(merchCollections.movies)
        ];

        const results = allShows.filter(show => {
            const translated = showNames[english ? "en" : "es"][show] || show;
            return (show + " " + translated).toLowerCase().includes(query);
        });

        content.innerHTML = `
            <p class="modal-description">${t.merchDescription}</p>

            <div class="show-buttons">
                ${results.map(show => {
                    const section = merchCollections.series[show] !== undefined
                        ? "series" : "movies";

                    const translated =
                        showNames[english ? "en" : "es"][show] || show;

                    return `
                        <button class="show-button"
                            onclick="openCollection('${section}','${escapeHTML(show)}')">
                            ${escapeHTML(translated)}
                        </button>
                    `;
                }).join("")}
            </div>

            ${results.length === 0
                ? `<div class="gallery-empty">${t.noResults}</div>`
                : ""}
        `;
    }
}


/* =========================================
   CLOSE CONTROLS
========================================= */

document.getElementById("archiveModal").addEventListener("click", event => {
    if (event.target === document.getElementById("archiveModal")) {
        closeModal();
    }
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape") closeModal();
});

document.getElementById("homeButton").href =
    "https://disneyrocklover.itch.io/disneychannelhomeexparchive";

</script>
</body>
