
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Disney Channel Merchandise Archive</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #101010;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

body {
    overflow-x: hidden;
}

/* MAIN PAGE */
.page {
    width: 100%;
    min-height: 100vh;
    padding: 25px 12px 35px;
}

/* HEADER */
.archive-header {
    width: min(1450px, 100%);
    margin: 0 auto 22px;
    position: relative;
    text-align: center;
    padding: 0 100px;
}

.archive-header h1 {
    margin: 0;
    color: #e8f0d9;
    font-size: clamp(22px, 4vw, 38px);
    letter-spacing: 2px;
    text-transform: uppercase;
}

.language-button {
    position: absolute;
    top: 0;
    right: 0;
    padding: 8px 12px;
    background: #30452c;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 4px;
    color: white;
    font-size: 10px;
    cursor: pointer;
}

.language-button:hover {
    background: #496541;
}

/* SEARCH */
.search-container {
    width: min(650px, 100%);
    margin: 17px auto 0;
}

.search-bar {
    width: 100%;
    padding: 12px 15px;
    background: #1b1b1b;
    border: 1px solid #596e49;
    border-left: 3px solid #78905f;
    border-radius: 3px;
    color: white;
    font-size: 12px;
    outline: none;
}

.search-bar:focus {
    border-color: #a3bb89;
}

.search-bar::placeholder {
    color: #9ba591;
}

/* CABINET BACKGROUND */
.cabinet-stage {
    position: relative;
    width: min(1600px, 100%);
    aspect-ratio: 1280 / 270;
    margin: 0 auto;
    background-image: url("merchandise%20and%20archives.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
}

/* INVISIBLE CLICKABLE AREAS */
.shelf-hotspot {
    position: absolute;
    top: 2%;
    height: 96%;
    border: 2px solid transparent;
    background: transparent;
    cursor: pointer;
    transition: background .2s, border .2s;
}

.shelf-hotspot:hover,
.shelf-hotspot:focus-visible {
    background: rgba(120,144,95,.13);
    border: 2px solid rgba(180,205,145,.65);
    outline: none;
}

.ads-hotspot {
    left: 12%;
    width: 22%;
}

.merch-hotspot {
    left: 65%;
    width: 22%;
}

/* FOOTER */
.main-footer {
    max-width: 1400px;
    margin: 28px auto 0;
    text-align: center;
}

.back-home {
    display: inline-block;
    padding: 10px 15px;
    background: #30452c;
    border-left: 3px solid #78905f;
    border-radius: 3px;
    color: #e8f0d9;
    text-decoration: none;
    font-size: 10px;
    font-weight: bold;
}

.back-home:hover {
    background: #496541;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    padding: 18px;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.90);
}

.modal.active {
    display: flex;
}

.modal-window {
    position: relative;
    width: min(1000px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    padding: 25px;
    background: #151515;
    border: 1px solid #596e49;
    border-top: 4px solid #78905f;
    box-shadow: 0 0 35px rgba(0,0,0,.8);
}

/* MODAL HEADER */
.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding-bottom: 15px;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,.15);
}

.modal-header h2 {
    margin: 0;
    color: #e8f0d9;
    font-size: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.close-button,
.back-button {
    padding: 8px 11px;
    background: #30452c;
    border: 1px solid rgba(255,255,255,.2);
    color: white;
    border-radius: 3px;
    font-size: 10px;
    cursor: pointer;
}

.close-button:hover,
.back-button:hover {
    background: #496541;
}

/* DESCRIPTIONS */
.modal-description {
    margin: 0 0 18px;
    color: #b9c3ae;
    font-size: 12px;
    line-height: 1.7;
}

/* NAVIGATION BUTTONS */
.archive-buttons {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 12px;
}

.archive-button {
    display: block;
    padding: 22px 15px;
    text-align: left;
    background: #222;
    border: 1px solid rgba(255,255,255,.12);
    border-left: 4px solid #78905f;
    color: #e8f0d9;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: background .2s;
}

.archive-button:hover {
    background: #30452c;
}

.archive-button small {
    display: block;
    margin-top: 8px;
    color: #a3bb89;
    font-size: 10px;
    font-weight: normal;
    line-height: 1.5;
}

/* CATEGORY SECTIONS */
.category-section {
    margin-bottom: 25px;
}

.category-title {
    margin: 0 0 12px;
    padding-bottom: 7px;
    color: #a3bb89;
    font-size: 13px;
    letter-spacing: 2px;
    border-bottom: 1px solid #596e49;
}

.show-buttons {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 10px;
}

.show-button {
    min-height: 48px;
    padding: 12px 8px;
    background: #222;
    border: 1px solid rgba(255,255,255,.12);
    border-left: 3px solid #78905f;
    color: white;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    transition: background .2s;
}

.show-button:hover {
    background: #30452c;
}

.show-button.hidden {
    display: none;
}

/* COLLECTION SEARCH */
.collection-search {
    width: 100%;
    margin: 0 0 18px;
    padding: 11px 13px;
    background: #1b1b1b;
    border: 1px solid #596e49;
    border-left: 3px solid #78905f;
    border-radius: 3px;
    color: white;
    font-size: 12px;
    outline: none;
}

.collection-search::placeholder {
    color: #9ba591;
}

/* GALLERY */
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 14px;
}

.gallery-card {
    overflow: hidden;
    background: #202020;
    border: 1px solid rgba(255,255,255,.12);
}

.gallery-card img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: contain;
    background: #111;
}

.gallery-caption {
    padding: 10px;
    color: #e8f0d9;
    font-size: 11px;
    text-align: center;
}

.gallery-card.hidden {
    display: none;
}

.gallery-empty {
    padding: 30px 15px;
    color: #b9c3ae;
    background: #202020;
    border: 1px dashed #596e49;
    text-align: center;
    font-size: 12px;
    line-height: 1.7;
}

.gallery-empty strong {
    display: block;
    margin-bottom: 8px;
    color: #a3bb89;
}

/* YOUTUBE PLAYER */
.video-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    margin-top: 15px;
}

.video-container iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

.playlist-link {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 13px;
    background: #30452c;
    border-left: 3px solid #78905f;
    color: #e8f0d9;
    text-decoration: none;
    font-size: 10px;
    font-weight: bold;
}

.playlist-link:hover {
    background: #496541;
}

/* MODAL FOOTER */
.modal-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 22px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,.12);
}

.archive-count {
    color: #849078;
    font-size: 9px;
}

/* MOBILE */
@media (max-width: 650px) {

    .page {
        padding: 18px 8px 25px;
    }

    .archive-header {
        padding: 42px 0 0;
    }

    .language-button {
        top: 0;
        right: 0;
    }

    .cabinet-stage {
        width: 100%;
    }

    .modal-window {
        padding: 15px;
    }

    .show-buttons {
        grid-template-columns: repeat(2, minmax(0,1fr));
    }

    .gallery-grid {
        grid-template-columns: repeat(2, minmax(0,1fr));
    }
}

@media (max-width: 380px) {

    .archive-buttons {
        grid-template-columns: 1fr;
    }

    .gallery-grid {
        grid-template-columns: 1fr;
    }

}
</style>
</head>

<body>

<div class="page">

    <!-- HEADER -->
    <header class="archive-header">

        <button
            class="language-button"
            id="languageButton"
            onclick="toggleLanguage()">
            ESPAÑOL
        </button>

        <h1 id="pageTitle">
            Disney Channel Merchandise Archive
        </h1>

        <div class="search-container">
            <input
                type="search"
                class="search-bar"
                id="archiveSearch"
                placeholder="Search the merchandise archive..."
                oninput="globalSearch()">
        </div>

    </header>


    <!-- CABINET -->
    <main>

        <div class="cabinet-stage">

            <!-- LEFT SIDE -->
            <button
                class="shelf-hotspot ads-hotspot"
                onclick="openAdsMenu()"
                aria-label="Open advertising and lost media archive">
            </button>

            <!-- RIGHT SIDE -->
            <button
                class="shelf-hotspot merch-hotspot"
                onclick="openMerchMenu()"
                aria-label="Open merchandise collections">
            </button>

        </div>

    </main>


    <!-- RETURN TO LIVING ROOM -->
    <footer class="main-footer">

        <a
            class="back-home"
            id="homeButton"
            href="https://disneyrocklover.itch.io/disneychannelhomeexparchive">
            BACK TO THE LIVING ROOM
        </a>

    </footer>

</div>


<!-- ARCHIVE MODAL -->
<div class="modal" id="archiveModal">

    <div class="modal-window">

        <div class="modal-header">

            <h2 id="modalTitle">ARCHIVE</h2>

            <button
                class="close-button"
                id="closeButton"
                onclick="closeModal()">
                CLOSE ✕
            </button>

        </div>

        <div id="modalContent"></div>

    </div>

</div>


<script>

/* =========================================
   ARCHIVE CONFIGURATION
========================================= */

/* PHYSICAL ADVERTISEMENTS */

const physicalAds = [

    // ADD SCANNED ADVERTISEMENTS HERE.
    // Example:
    // {
    //     src: "merch/ads/hannah-ad.jpg",
    //     title: "Hannah Montana Magazine Advertisement"
    // }

];


/* LOST MEDIA YOUTUBE PLAYLIST */

const lostMediaPlaylist =
    "https://www.youtube.com/playlist?list=PLWpcZxU5Jq5s";

const lostMediaEmbed =
    "https://www.youtube-nocookie.com/embed/videoseries?list=PLWpcZxU5Jq5s";


/* MERCHANDISE COLLECTIONS

   Add images and descriptions to the relevant collection.
   Each collection has its own search bar.

*/

const merchCollections = {

    series: {

        "Hannah Montana": [],
        "That's So Raven": [],
        "Kim Possible": [],
        "Wizards of Waverly Place": [],
        "The Proud Family": []

    },

    movies: {

        "Camp Rock": [],
        "High School Musical": [],
        "The Cheetah Girls": []

    }

};


/* =========================================
   TRANSLATIONS
========================================= */

const translations = {

    en: {

        title: "Disney Channel Merchandise Archive",

        search: "Search the merchandise archive...",

        home: "BACK TO THE LIVING ROOM",

        close: "CLOSE ✕",

        back: "BACK",

        adsTitle: "ADVERTISING ARCHIVE",

        adsDescription:
            "Explore the advertising and promotional materials preserved in the archive.",

        physical: "PHYSICAL ADS",

        physicalDescription:
            "Scanned printed advertisements, magazines, catalogs and promotional materials.",

        lost: "LOST MEDIA",

        lostDescription:
            "Explore recovered and archived Disney Channel commercials and promotional recordings.",

        physicalTitle: "PHYSICAL ADVERTISEMENTS",

        lostTitle: "LOST MEDIA ARCHIVE",

        merchTitle: "MERCHANDISE COLLECTIONS",

        merchDescription:
            "Explore the archived merchandise collections.",

        series: "TELEVISION SERIES",

        movies: "MOVIES",

        collectionSearch:
            "Search this collection...",

        emptyTitle: "COLLECTION UNDER CONSTRUCTION",

        emptyText:
            "No merchandise has been added to this collection yet.",

        emptyAds:
            "No scanned advertisements have been added yet.",

        noResults:
            "No matching items were found.",

        playlistDescription:
            "Browse and play the archived videos directly below. Use the YouTube playlist controls to explore the available recordings.",

        playlistButton:
            "OPEN PLAYLIST ON YOUTUBE",

        itemCount:
            "ARCHIVED ITEMS"

    },

    es: {

        title: "Archivo de Merchandising de Disney Channel",

        search: "Buscar en el archivo de merchandising...",

        home: "VOLVER AL LIVING",

        close: "CERRAR ✕",

        back: "VOLVER",

        adsTitle: "ARCHIVO DE PUBLICIDAD",

        adsDescription:
            "Explora los materiales publicitarios y promocionales preservados en el archivo.",

        physical: "ANUNCIOS FÍSICOS",

        physicalDescription:
            "Anuncios impresos digitalizados, revistas, catálogos y materiales promocionales.",

        lost: "LOST MEDIA",

        lostDescription:
            "Explora comerciales y grabaciones promocionales recuperadas y archivadas de Disney Channel.",

        physicalTitle: "ANUNCIOS FÍSICOS",

        lostTitle: "ARCHIVO DE LOST MEDIA",

        merchTitle: "COLECCIONES DE MERCHANDISING",

        merchDescription:
            "Explora las colecciones de productos archivados.",

        series: "SERIES DE TELEVISIÓN",

        movies: "PELÍCULAS",

        collectionSearch:
            "Buscar en esta colección...",

        emptyTitle: "COLECCIÓN EN CONSTRUCCIÓN",

        emptyText:
            "Todavía no se han agregado productos a esta colección.",

        emptyAds:
            "Todavía no se han agregado anuncios digitalizados.",

        noResults:
            "No se encontraron artículos.",

        playlistDescription:
            "Explora y reproduce los videos archivados directamente aquí. Utiliza los controles de YouTube para recorrer las grabaciones disponibles.",

        playlistButton:
            "ABRIR LISTA EN YOUTUBE",

        itemCount:
            "ARTÍCULOS ARCHIVADOS"

    }

};


/* SHOW NAME TRANSLATIONS */

const showNames = {

    en: {
        "Hannah Montana": "Hannah Montana",
        "That's So Raven": "That's So Raven",
        "Kim Possible": "Kim Possible",
        "Wizards of Waverly Place": "Wizards of Waverly Place",
        "The Proud Family": "The Proud Family",
        "Camp Rock": "Camp Rock",
        "High School Musical": "High School Musical",
        "The Cheetah Girls": "The Cheetah Girls"
    },

    es: {
        "Hannah Montana": "Hannah Montana",
        "That's So Raven": "Es Tan Raven",
        "Kim Possible": "Kim Possible",
        "Wizards of Waverly Place": "Los Hechiceros de Waverly Place",
        "The Proud Family": "La Familia Proud",
        "Camp Rock": "Camp Rock",
        "High School Musical": "High School Musical",
        "The Cheetah Girls": "Las Cheetah Girls"
    }

};


/* =========================================
   LANGUAGE SWITCHING
========================================= */

let english = true;
let currentView = "home";
let selectedSection = "";
let selectedShow = "";

function getT() {
    return english ? translations.en : translations.es;
}

function toggleLanguage() {

    english = !english;

    const t = getT();

    document.documentElement.lang = english ? "en" : "es";

    document.getElementById("languageButton").textContent =
        english ? "ESPAÑOL" : "ENGLISH";

    document.getElementById("pageTitle").textContent =
        t.title;

    document.getElementById("archiveSearch").placeholder =
        t.search;

    document.getElementById("homeButton").textContent =
        t.home;

    document.getElementById("homeButton").href =
        english
        ? "https://disneyrocklover.itch.io/disneychannelhomeexparchive"
        : "https://disneyrocklover.itch.io/lacasaexpdisneychannelarchivo";

    document.getElementById("closeButton").textContent =
        t.close;

    if (currentView !== "home") {
        renderCurrentView();
    }

}


/* =========================================
   MODAL
========================================= */

function openModal() {

    document
        .getElementById("archiveModal")
        .classList.add("active");

}

function closeModal() {

    document
        .getElementById("archiveModal")
        .classList.remove("active");

    currentView = "home";

}

function setTitle(title) {

    document.getElementById("modalTitle").textContent = title;

}


/* =========================================
   GLOBAL SEARCH
========================================= */

function globalSearch() {

    const query = document
        .getElementById("archiveSearch")
        .value
        .trim()
        .toLowerCase();

    if (query.length === 0) {
        if (currentView === "global-search") {
            closeModal();
        }
        return;
    }

    currentView = "global-search";

    openModal();
    renderCurrentView();

}


/* =========================================
   LEFT SHELF: ADVERTISING
========================================= */

function openAdsMenu() {

    currentView = "ads";

    openModal();
    renderCurrentView();

}

function openPhysicalAds() {

    currentView = "physical";

    renderCurrentView();

}

function openLostMedia() {

    currentView = "lost";

    renderCurrentView();

}


/* =========================================
   RIGHT SHELF: MERCHANDISE
========================================= */

function openMerchMenu() {

    currentView = "merch";

    openModal();
    renderCurrentView();

}

function openCollection(section, show) {

    selectedSection = section;
    selectedShow = show;

    currentView = "collection";

    renderCurrentView();

}


/* =========================================
   SAFE HTML TEXT
========================================= */

function escapeHTML(value) {

    return String(value).replace(/[&<>"']/g, function(char) {

        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];

    });

}


/* =========================================
   GALLERY
========================================= */

function renderGallery(items, emptyMessage) {

    const t = getT();

    if (!items || items.length === 0) {

        return `
            <div class="gallery-empty">
                <strong>${t.emptyTitle}</strong>
                ${emptyMessage}
            </div>
        `;

    }

    return `
        <div class="gallery-grid" id="galleryGrid">

            ${items.map(function(item) {

                return `
                    <div
                        class="gallery-card"
                        data-search="${escapeHTML(
                            (item.title || "") + " " + (item.description || "")
                        ).toLowerCase()}">

                        <img
                            src="${escapeHTML(item.src)}"
                            alt="${escapeHTML(item.title || "Archived item")}"
                            loading="lazy">

                        <div class="gallery-caption">
                            ${escapeHTML(item.title || "")}
                        </div>

                    </div>
                `;

            }).join("")}

        </div>
    `;

}


/* FILTER CURRENT COLLECTION */

function filterCollection() {

    const input = document.getElementById("collectionSearch");

    if (!input) return;

    const query = input.value.toLowerCase().trim();

    const cards = document.querySelectorAll(".gallery-card");

    let visible = 0;

    cards.forEach(function(card) {

        const matches = card.dataset.search.includes(query);

        card.classList.toggle("hidden", !matches);

        if (matches) visible++;

    });

    let noResults = document.getElementById("noResults");

    if (!noResults && cards.length > 0) {

        noResults = document.createElement("div");

        noResults.id = "noResults";
        noResults.className = "gallery-empty";

        document.getElementById("galleryGrid").after(noResults);

    }

    if (noResults) {

        noResults.textContent = getT().noResults;

        noResults.style.display =
            visible === 0 ? "block" : "none";

    }

}


/* =========================================
   BACK NAVIGATION
========================================= */

function goBack() {

    if (
        currentView === "physical" ||
        currentView === "lost"
    ) {

        currentView = "ads";

    } else if (currentView === "collection") {

        currentView = "merch";

    } else {

        closeModal();
        return;

    }

    renderCurrentView();

}


/* =========================================
   RENDER CURRENT PAGE
========================================= */

function renderCurrentView() {

    const t = getT();

    const content = document.getElementById("modalContent");

    if (currentView === "ads") {

        setTitle(t.adsTitle);

        content.innerHTML = `

            <p class="modal-description">
                ${t.adsDescription}
            </p>

            <div class="archive-buttons">

                <button
                    class="archive-button"
                    onclick="openPhysicalAds()">

                    ${t.physical}

                    <small>${t.physicalDescription}</small>

                </button>

                <button
                    class="archive-button"
                    onclick="openLostMedia()">

                    ${t.lost}

                    <small>${t.lostDescription}</small>

                </button>

            </div>

        `;

    }

    else if (currentView === "physical") {

        setTitle(t.physicalTitle);

        content.innerHTML = `

            ${renderGallery(physicalAds, t.emptyAds)}

            <div class="modal-footer">

                <button class="back-button" onclick="goBack()">
                    ← ${t.back}
                </button>

                <span class="archive-count">
                    ${physicalAds.length} ${t.itemCount}
                </span>

            </div>

        `;

    }

    else if (currentView === "lost") {

        setTitle(t.lostTitle);

        content.innerHTML = `

            <p class="modal-description">
                ${t.playlistDescription}
            </p>

            <div class="video-container">

                <iframe
                    src="${lostMediaEmbed}"
                    title="Disney Channel Lost Media Playlist"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen
                    loading="lazy">
                </iframe>

            </div>

            <a
                class="playlist-link"
                href="${lostMediaPlaylist}"
                target="_blank"
                rel="noopener">
                ${t.playlistButton}
            </a>

            <div class="modal-footer">

                <button class="back-button" onclick="goBack()">
                    ← ${t.back}
                </button>

            </div>

        `;

    }

    else if (currentView === "merch") {

        setTitle(t.merchTitle);

        const query = document
            .getElementById("archiveSearch")
            .value
            .toLowerCase()
            .trim();

        content.innerHTML = `

            <p class="modal-description">
                ${t.merchDescription}
            </p>

            <section class="category-section">

                <h3 class="category-title">
                    ${t.series}
                </h3>

                <div class="show-buttons">

                    ${Object.keys(merchCollections.series).map(function(show) {

                        const name = showNames[english ? "en" : "es"][show];

                        const matches =
                            (show + " " + name).toLowerCase().includes(query);

                        return `
                            <button
                                class="show-button ${matches ? "" : "hidden"}"
                                onclick="openCollection('series','${escapeHTML(show)}')">
                                ${escapeHTML(name)}
                            </button>
                        `;

                    }).join("")}

                </div>

            </section>

            <section class="category-section">

                <h3 class="category-title">
                    ${t.movies}
                </h3>

                <div class="show-buttons">

                    ${Object.keys(merchCollections.movies).map(function(show) {

                        const name = showNames[english ? "en" : "es"][show];

                        const matches =
                            (show + " " + name).toLowerCase().includes(query);

                        return `
                            <button
                                class="show-button ${matches ? "" : "hidden"}"
                                onclick="openCollection('movies','${escapeHTML(show)}')">
                                ${escapeHTML(name)}
                            </button>
                        `;

                    }).join("")}

                </div>

            </section>

        `;

    }

    else if (currentView === "collection") {

        const items = merchCollections[selectedSection][selectedShow] || [];

        const translatedName =
            showNames[english ? "en" : "es"][selectedShow] || selectedShow;

        setTitle(translatedName);

        content.innerHTML = `

            <p class="modal-description">
                ${t.merchDescription}
            </p>

            <input
                type="search"
                class="collection-search"
                id="collectionSearch"
                placeholder="${t.collectionSearch}"
                oninput="filterCollection()">

            <div id="collectionGallery">
                ${renderGallery(items, t.emptyText)}
            </div>

            <div class="modal-footer">

                <button class="back-button" onclick="goBack()">
                    ← ${t.back}
                </button>

                <span class="archive-count">
                    ${items.length} ${t.itemCount}
                </span>

            </div>

        `;

    }

    else if (currentView === "global-search") {

        setTitle(t.merchTitle);

        const query = document
            .getElementById("archiveSearch")
            .value
            .toLowerCase()
            .trim();

        const allShows = [
            ...Object.keys(merchCollections.series),
            ...Object.keys(merchCollections.movies)
        ];

        const results = allShows.filter(function(show) {

            const translated =
                showNames[english ? "en" : "es"][show] || show;

            return (show + " " + translated)
                .toLowerCase()
                .includes(query);

        });

        content.innerHTML = `

            <p class="modal-description">
                ${t.merchDescription}
            </p>

            <div class="show-buttons">

                ${results.map(function(show) {

                    const section =
                        merchCollections.series[show] !== undefined
                        ? "series"
                        : "movies";

                    const translated =
                        showNames[english ? "en" : "es"][show] || show;

                    return `
                        <button
                            class="show-button"
                            onclick="openCollection('${section}','${escapeHTML(show)}')">
                            ${escapeHTML(translated)}
                        </button>
                    `;

                }).join("")}

            </div>

            ${results.length === 0
                ? `<div class="gallery-empty">${t.noResults}</div>`
                : ""}

        `;

    }

}


/* =========================================
   CLOSE MODAL
========================================= */

document
    .getElementById("archiveModal")
    .addEventListener("click", function(event) {

        if (event.target === this) {
            closeModal();
        }

    });

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        closeModal();
    }

});


/* INITIALIZE HOME LINK */

document.getElementById("homeButton").href =
    "https://disneyrocklover.itch.io/disneychannelhomeexparchive";

</script>
